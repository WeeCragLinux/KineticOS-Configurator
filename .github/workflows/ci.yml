name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fedora-build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: dnf install -y git cmake gcc-c++ gtkmm4.0-devel libadwaita-devel glib2-devel desktop-file-utils appstream

      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Validate the desktop file
        run: desktop-file-validate packaging/com.weecraglinux.kinetic-configurator.desktop

      - name: Validate the AppStream metainfo
        run: appstreamcli validate --no-net packaging/com.weecraglinux.kinetic-configurator.metainfo.xml
